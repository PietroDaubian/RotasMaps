<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rotas de Clientes</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mu:#6b7480;--ln:#e3e6ea;--ac:#2f6df6;--ac2:#eaf1ff;--dg:#e5484d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#eef1f5;--mu:#8e98a6;--ln:#272d37;--ac:#5b8cff;--ac2:#1c2840;--dg:#ff6b70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#eef1f5;--mu:#8e98a6;--ln:#272d37;--ac:#5b8cff;--ac2:#1c2840;--dg:#ff6b70;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 8px;animation:fd .5s ease both}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
.sub{color:var(--mu);font-size:14px;margin-top:2px}.chip{margin-top:8px;border:1px solid var(--ln);background:var(--card);color:var(--mu);border-radius:999px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer;transition:transform .15s,color .3s}.chip:active{transform:scale(.94)}
.bar{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer;transition:all .25s cubic-bezier(.2,.9,.3,1)}
.tab:active{transform:scale(.94)}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff;transform:scale(1.04)}
.tab.add{color:var(--ac);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 10px}.tools select{appearance:none;padding:10px 12px;border:0;font:inherit;font-size:14px}
.tools input{flex:1;min-width:0;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 12px;font:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
.tools input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
#tn{max-width:46%;font-weight:600}
.btn{border:0;background:var(--ac2);color:var(--ac);border-radius:12px;padding:0 14px;font:inherit;font-size:14px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.93)}
.btn.warn{background:var(--dg);color:#fff}
#wrap{margin:0 12px;background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow-x:auto;animation:fd .6s .1s ease both}
.tbl{min-width:720px}
.row{display:grid;grid-template-columns:36px minmax(140px,1fr) minmax(120px,1fr) minmax(200px,2fr) 104px 88px;align-items:center;border-bottom:1px solid var(--ln);max-height:80px;overflow:hidden;transition:max-height .3s ease,opacity .3s ease,transform .3s ease}
.row.in{animation:rin .4s cubic-bezier(.2,.9,.3,1)}
.row.out{max-height:0;opacity:0;transform:translateX(-24px);border-color:transparent}
.row.hide{display:none}
.row.head{background:var(--ac2);color:var(--mu);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:10px 0}
.row.head>div{padding:0 10px}
.n{color:var(--mu);font-size:13px;text-align:center}
.row input{width:100%;border:0;background:transparent;color:var(--tx);padding:15px 10px;font:inherit;outline:none;border-radius:6px;transition:box-shadow .2s,background .2s}
.row input:focus{box-shadow:inset 0 0 0 2px var(--ac);background:var(--ac2)}
.row input.bad{animation:shk .35s}
.act{position:sticky;right:0;display:flex;gap:4px;align-items:center;justify-content:center;background:var(--card);height:100%;padding:0 6px;box-shadow:-8px 0 8px -8px rgba(0,0,0,.15)}
.act button{border:0;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;transition:transform .15s;background:var(--ac2);color:var(--ac)}
.act .del{background:transparent;color:var(--mu)}
.act button:active{transform:scale(.85)}
.empty{padding:26px;text-align:center;color:var(--mu);font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));border:0;background:var(--ac);color:#fff;font:inherit;font-weight:600;padding:14px 22px;border-radius:999px;box-shadow:0 8px 24px rgba(47,109,246,.4);cursor:pointer;transition:transform .2s cubic-bezier(.2,.9,.3,1)}
.fab:active{transform:scale(.92)}
.spacer{height:100px}.fi{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:12px;padding:12px;font:inherit;margin-bottom:10px;outline:none;transition:border-color .2s,box-shadow .2s}.fi:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}.big{width:100%;padding:14px;background:var(--ac);color:#fff;font-weight:600;margin-top:4px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.25,1)}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--ln);margin:0 auto 14px}
.sheet h2{margin:0;font-size:19px}
.sheet p{margin:4px 0 16px;color:var(--mu);font-size:14px}
.map{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--ln);border-radius:16px;color:var(--tx);text-decoration:none;margin-bottom:10px;transition:transform .15s,border-color .2s}
.map:active{transform:scale(.97)}
.map.rec{border-color:var(--ac);background:var(--ac2)}
.map i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700}
.map small{display:block;color:var(--mu)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;transition:transform .4s cubic-bezier(.2,.9,.25,1)}
.toast.on{transform:translate(-50%,0)}
@keyframes fd{from{opacity:0;transform:translateY(10px)}}
@keyframes rin{from{opacity:0;transform:translateY(-14px) scale(.98);background:var(--ac2)}}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header><h1>Rotas de Clientes</h1><div class="sub" id="cnt"></div><button class="chip" id="acc">☁ Só neste aparelho</button></header>
<div class="bar" id="tabs"></div>
<div class="tools"><input id="tn" placeholder="Nome da tabela"><input id="q" type="search" placeholder="Buscar…"><select class="btn" id="mp" aria-label="App de mapas"><option value="auto">Mapa: automático</option><option value="g">Google Maps</option><option value="a">Apple Maps</option><option value="ask">Perguntar</option></select><button class="btn" id="dt">Excluir</button></div>
<div class="tools" style="padding-top:0"><input id="td" placeholder="Observação da tabela (opcional)"></div>
<div id="wrap"><div class="tbl">
<div class="row head"><div>#</div><div>Cliente</div><div>Local</div><div>Endereço</div><div>CEP</div><div></div></div>
<div id="rows"></div></div></div>
<div class="spacer"></div>
<button class="fab" id="fab">+ Linha</button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><h2 id="sc"></h2><p id="sa"></p>
<a class="map" id="gm" target="_blank" rel="noopener"><i style="background:#34a853">G</i><div>Google Maps<small>Android, iOS e navegador</small></div></a>
<a class="map" id="am" target="_blank" rel="noopener"><i style="background:#1d8cf8">A</i><div>Apple Maps<small>iPhone, iPad e Mac</small></div></a></div>
<div class="sheet" id="ns"><div class="grab"></div><h2>Nova tabela</h2><p>Dê um nome e, se quiser, uma observação.</p><input class="fi" id="nn" placeholder="Nome da tabela"><input class="fi" id="nd" placeholder="Observação (opcional)"><button class="btn big" id="nc">Criar tabela</button></div>
<div class="toast" id="toast"></div>
<script>
const K='rotas-clientes-v1',$=s=>document.querySelector(s);
const F=[['c','Cliente'],['l','Local'],['e','Endereço'],['p','CEP']];
let S=null,seq=Date.now();
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.tables||!S.tables.length)S={active:0,tables:[{name:'Clientes',rows:[{id:1,c:'',l:'',e:'',p:''}]}]};
let DOC=null,tm;
const setChip=t=>{$('#acc').textContent='☁ '+t};
function push(){if(!DOC)return;clearTimeout(tm);setChip('Sincronizando…');tm=setTimeout(()=>DOC.set({json:JSON.stringify(S),ts:S.ts}).then(()=>setChip('Conta sincronizada')).catch(()=>setChip('Falha ao sincronizar')),900)}
const save=()=>{S.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}push()};
const T=()=>S.tables[S.active];
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const cep=v=>{v=v.replace(/\D/g,'').slice(0,8);return v.length>5?v.slice(0,5)+'-'+v.slice(5):v};
const apple=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
const PIN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const rowHTML=(r,i,anim)=>`<div class="row${anim?' in':''}" data-id="${r.id}"><div class="n">${i+1}</div>`+F.map(f=>`<input data-f="${f[0]}" value="${esc(r[f[0]])}" placeholder="${f[1]}" ${f[0]=='p'?'inputmode="numeric"':''} autocomplete="off">`).join('')+`<div class="act"><button class="go" aria-label="Abrir no mapa">${PIN}</button><button class="del" aria-label="Remover linha">✕</button></div></div>`;
function render(){
 $('#tabs').innerHTML=S.tables.map((t,i)=>`<button class="tab${i==S.active?' on':''}" data-i="${i}">${esc(t.name)||'Sem nome'}</button>`).join('')+'<button class="tab add" data-add>+ Tabela</button>';
 $('#tn').value=T().name;$('#td').value=T().note||'';
 $('#rows').innerHTML=T().rows.map((r,i)=>rowHTML(r,i,true)).join('');
 $('#dt').classList.remove('warn');$('#dt').textContent='Excluir';
 info();filter();
}
function info(){const n=T().rows.length;$('#cnt').textContent=n+(n==1?' cliente':' clientes')+' nesta tabela';$('#dt').style.display=S.tables.length>1?'':'none'}
function filter(){const q=$('#q').value.toLowerCase();document.querySelectorAll('#rows .row').forEach(el=>{const t=[...el.querySelectorAll('input')].map(i=>i.value).join(' ').toLowerCase();el.classList.toggle('hide',!!q&&!t.includes(q))})}
function renum(){document.querySelectorAll('#rows .row .n').forEach((n,i)=>n.textContent=i+1);info()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
function addRow(focusF){const r={id:++seq,c:'',l:'',e:'',p:''};T().rows.push(r);save();$('#rows').insertAdjacentHTML('beforeend',rowHTML(r,T().rows.length-1,true));info();const el=$('#rows').lastElementChild;el.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(()=>el.querySelector('[data-f="'+(focusF||'c')+'"]').focus({preventScroll:true}),60)}
const find=el=>T().rows.find(r=>r.id==el.closest('.row').dataset.id);
$('#rows').addEventListener('input',e=>{const i=e.target;if(i.dataset.f=='p')i.value=cep(i.value);find(i)[i.dataset.f]=i.value;save();if($('#q').value)filter()});
$('#rows').addEventListener('keydown',e=>{if(e.key!='Enter')return;e.preventDefault();const row=e.target.closest('.row'),next=row.nextElementSibling;if(next)next.querySelector('[data-f="'+e.target.dataset.f+'"]').focus();else addRow(e.target.dataset.f)});
$('#rows').addEventListener('click',e=>{
 const row=e.target.closest('.row');if(!row)return;
 if(e.target.closest('.go'))openMap(find(row),row);
 if(e.target.closest('.del')){row.classList.add('out');setTimeout(()=>{T().rows=T().rows.filter(r=>r.id!=row.dataset.id);save();row.remove();renum()},300)}
});
function openMap(r,row){
 const addr=[r.e,r.p].filter(Boolean).join(', ')||r.l;
 if(!addr.trim()){const i=row.querySelector('[data-f="e"]');i.classList.remove('bad');void i.offsetWidth;i.classList.add('bad');i.focus();toast('Preencha o endereço primeiro');return}
 const q=encodeURIComponent(addr+', Brasil');
 const G='https://www.google.com/maps/dir/?api=1&destination='+q,A='https://maps.apple.com/?daddr='+q;
 $('#gm').href=G;$('#am').href=A;
 const m=S.map||'auto';
 if(m!='ask'){const u=(m=='g'||(m=='auto'&&!apple))?G:A;if(window.open(u,'_blank'))return}
 $('#gm').classList.toggle('rec',!apple);$('#am').classList.toggle('rec',apple);
 const s=$('#sheet');s.insertBefore($(apple?'#am':'#gm'),$('#gm'));
 $('#sc').textContent=r.c||r.l||'Endereço';$('#sa').textContent=addr;
 $('#sheet').classList.add('open');$('#scrim').classList.add('open');
}
function closeSheet(){$('#sheet').classList.remove('open');$('#ns').classList.remove('open');$('#scrim').classList.remove('open')}
$('#scrim').onclick=closeSheet;
document.querySelectorAll('.map').forEach(a=>a.addEventListener('click',()=>setTimeout(closeSheet,250)));
$('#fab').onclick=()=>addRow();
$('#mp').value=S.map||'auto';
$('#mp').onchange=e=>{S.map=e.target.value;save();toast('Preferência salva')};
$('#q').oninput=filter;
$('#tn').oninput=e=>{T().name=e.target.value;$('.tab.on').textContent=e.target.value||'Sem nome';save()};
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;
 if(b.dataset.add!==undefined){$('#nn').value='Tabela '+(S.tables.length+1);$('#nd').value='';$('#ns').classList.add('open');$('#scrim').classList.add('open');setTimeout(()=>{$('#nn').focus();$('#nn').select()},350);return}
 else S.active=+b.dataset.i;
 save();render();$('.tab.on').scrollIntoView({inline:'center',behavior:'smooth',block:'nearest'})});
$('#dt').onclick=e=>{const b=e.target;if(!b.classList.contains('warn')){b.classList.add('warn');b.textContent='Confirmar?';clearTimeout(b.h);b.h=setTimeout(()=>{b.classList.remove('warn');b.textContent='Excluir'},2500);return}
 S.tables.splice(S.active,1);S.active=Math.max(0,S.active-1);save();render()};
function mk(){const n=$('#nn').value.trim()||'Tabela '+(S.tables.length+1);S.tables.push({name:n,note:$('#nd').value.trim(),rows:[{id:++seq,c:'',l:'',e:'',p:''}]});S.active=S.tables.length-1;save();closeSheet();render();$('.tab.on').scrollIntoView({inline:'center',behavior:'smooth',block:'nearest'})}
$('#nc').onclick=mk;$('#ns').addEventListener('keydown',e=>{if(e.key=='Enter')mk()});
$('#td').oninput=e=>{T().note=e.target.value;save()};
render();
$('#acc').onclick=()=>toast(DOC?'Seus dados estão salvos na sua conta':'Abra pelo claude.ai com a conta logada para sincronizar');
(async()=>{try{
 const db=await claude.use('db'),user=await claude.use('user');
 if(!db||!user)return;const id=await user.id();if(!id)return;
 const ref=db.collection('data/users/'+id).doc('rotas');
 const snap=await ref.get(),c=snap.exists&&snap.data();
 DOC=ref;
 if(c&&c.json&&c.ts>(S.ts||0)){S=JSON.parse(c.json);if(S.active>=S.tables.length)S.active=0;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render();setChip('Conta sincronizada');toast('Dados da conta carregados')}
 else{setChip('Conta conectada');if(S.tables.some(t=>t.rows.some(r=>r.c||r.l||r.e||r.p))){S.ts=S.ts||Date.now();push()}}
}catch(e){}})();
</script>
</body>
</html>
